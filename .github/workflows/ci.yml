name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check project and license coverage
        run: python3 scripts/check-project.py
      - name: Build app and all test targets
        run: >-
          xcodebuild -project Pasta.xcodeproj -scheme Pasta
          -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/ci
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build-for-testing
      - name: Run core tests without keyboard automation
        run: >-
          xcodebuild -project Pasta.xcodeproj -scheme Pasta
          -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/ci
          -onlyUsePackageVersionsFromResolvedFile -only-testing:PastaTests
          -resultBundlePath .build/results/core.xcresult test-without-building
      - name: Ensure the build did not modify tracked project files
        run: git diff --exit-code
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: .build/results/
          if-no-files-found: ignore
          retention-days: 14
